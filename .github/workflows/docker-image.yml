name: Build Docker Image and push to docker repo

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - ".github/workflows/**"
      - "poly_ubs_final.sql"
      - "poly_ubs_table.sql"
      - "poly_ubs_data.sql"

  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - ".github/workflows/**"
      - "poly_ubs_final.sql"
      - "poly_ubs_table.sql"
      - "poly_ubs_data.sql"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Extract short commit SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push (dev branch)
      if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          zetanox/ubrain:dev-latest
          zetanox/ubrain:dev-${{ steps.vars.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push (main branch)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          zetanox/ubrain:latest
          zetanox/ubrain:v${{ steps.vars.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build only (pull request)
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

