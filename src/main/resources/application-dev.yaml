server:
  port: ${SERVER_PORT}

spring:
  application:
    name: Electronics-EC-Website-BE

  # JWT
  jwt:
    signerKey: ${JWT_SECRET}
  # MySQL DataSource
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${MAIL_HOST}

sepay:
  bank-code: ${SEPAY_BANK_CODE}
  account-no: ${SEPAY_ACCOUNT_NO}
  account-name: ${SEPAY_ACCOUNT_NAME}
  qr:
    template: ${SEPAY_QR_TEMPLATE:compact}
  webhook:
    api-key: ${SEPAY_WEBHOOK_API_KEY:}

ghn:
  token: ${GHN_TOKEN}
  shop-id: ${SHOP_ID}

google:
  client-id: ${GOOGLE_CLIENT_ID}

